name: Report Cloudflare registry storage

# Read-only: aggregate metadata only, no report content or deletion.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read registry storage metrics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26e873c5d55e5e386df482c9dbe8bcd7
          CLOUDFLARE_REGISTRY_DATABASE_ID: 00dc29ae-0815-4393-a915-d0cc07b36556
          CLOUDFLARE_SCAN_DATABASE_ID: 42467eb8-8beb-4fd8-8e5e-332458cac5f3
        run: node scripts/report-cloudflare-registry-storage.mjs
