name: Deploy web app code to Cloudflare

# Use this only for code-only commits when the normal deployment is blocked
# by a temporary D1 migration/read-quota failure. Schema changes must continue
# through cloudflare-deploy.yml so migrations remain an explicit prerequisite.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardrails-production-operations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run cf:build
      - name: Exclude source-only registry mirror from Workers Assets
        run: printf '%s\n' 'registry-snapshot.json' > .open-next/assets/.assetsignore
      - name: Deploy production Worker without D1 migration reads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26e873c5d55e5e386df482c9dbe8bcd7
        run: npx wrangler deploy --config wrangler.jsonc
