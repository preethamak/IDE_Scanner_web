name: Cleanup Cloudflare scan storage

# This is an explicit, two-phase operation. The default run is a read-only
# dry run; APPLY=true is required before any report payload is deleted.
on:
  workflow_dispatch:
    inputs:
      preserve_scanner_build:
        description: Scanner build whose non-release candidate reports must be retained
        required: true
        type: string
      apply:
        description: Delete non-active public report payloads from older builds
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Inspect or clean stale public scan payloads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26e873c5d55e5e386df482c9dbe8bcd7
          CLOUDFLARE_SCAN_DATABASE: abscissa-scan-data
          PRESERVE_SCANNER_BUILD: ${{ inputs.preserve_scanner_build }}
          APPLY: ${{ inputs.apply }}
        run: node scripts/cleanup-cloudflare-scan-storage.mjs
