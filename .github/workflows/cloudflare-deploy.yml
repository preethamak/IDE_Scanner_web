name: Deploy web app to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployment applies D1 migrations. Keep it serialized with publication
# activation and registry imports so schema changes cannot race the pointer
# flip or chunk verification.
concurrency:
  group: guardrails-production-operations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is required for a production deployment."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Sync optional transactional email provider
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26e873c5d55e5e386df482c9dbe8bcd7
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.jsonc
          else
            echo "RESEND_API_KEY is not configured; retaining the current email fallback."
          fi
      - name: Apply Cloudflare D1 migrations
        run: |
          npx wrangler d1 migrations apply abscissa-registry --remote
          npx wrangler d1 migrations apply abscissa-scan-data --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26e873c5d55e5e386df482c9dbe8bcd7
      - run: npm run cf:build
      - name: Exclude source-only registry mirror from Workers Assets
        run: |
          # The catalog mirror is fetched by the server-side publication
          # fallback. It is intentionally kept in git for refresh/audit
          # workflows, but its 30+ MiB payload exceeds the Workers Assets
          # per-file limit and must not be uploaded as a public static file.
          printf '%s\n' 'registry-snapshot.json' > .open-next/assets/.assetsignore
      - name: Deploy production Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26e873c5d55e5e386df482c9dbe8bcd7
