name: Refresh extension catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      scan_batch_limit:
        description: Maximum new Deep Scans to dispatch
        required: false
        default: "100"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/refresh-catalog.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCAN_BATCH_LIMIT: ${{ inputs.scan_batch_limit || '100' }}
      - name: Verify public release health
        env:
          LAUNCH_HEALTH_SECRET: ${{ secrets.LAUNCH_HEALTH_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${LAUNCH_HEALTH_SECRET}" \
            https://ide-scanner.vercel.app/api/internal/launch-health
