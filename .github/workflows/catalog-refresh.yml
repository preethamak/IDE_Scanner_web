name: Refresh extension catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      scan_batch_limit:
        description: Maximum new Deep Scans to dispatch
        required: false
        default: "100"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/refresh-catalog.mjs
        env:
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SCAN_BATCH_LIMIT: ${{ inputs.scan_batch_limit || '100' }}
      - name: Export public registry mirror
        run: node scripts/export-public-registry.mjs
        env:
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      - name: Publish public registry mirror
        run: |
          if [ -z "$(git status --short -- public/registry-snapshot.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/registry-snapshot.json
          git commit -m "chore: refresh public registry mirror [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Verify public release health
        env:
          LAUNCH_HEALTH_URL: https://abscissa.dev
          LAUNCH_HEALTH_SECRET: ${{ secrets.LAUNCH_HEALTH_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/verify-release-health.mjs
