name: Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end and accessibility checks
        run: npm run test:e2e
      - run: npm run build
