name: Report Cloudflare candidate gaps

on:
  workflow_dispatch:
    inputs:
      scanner_build:
        description: Scanner build to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Report incomplete candidate jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26e873c5d55e5e386df482c9dbe8bcd7
          CLOUDFLARE_SCAN_DATABASE: abscissa-scan-data
          SCANNER_BUILD: ${{ inputs.scanner_build }}
        run: node scripts/report-cloudflare-candidate-gaps.mjs
